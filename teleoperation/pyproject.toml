[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-dynamixel-teleop"
version = "0.1.0"
description = "Calibrated dual leader/follower DYNAMIXEL teleoperation"
requires-python = ">=3.10"
dependencies = ["dynamixel-sdk==4.0.5", "pyserial==3.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
teleop = "teleop.cli:main"

[tool.setuptools.packages.find]
include = ["teleop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
